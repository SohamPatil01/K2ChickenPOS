name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @azela-pos/db exec prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci

      - name: Typecheck
        run: pnpm type-check

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Unit tests (API)
        run: pnpm --filter @azela-pos/api test

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high || true

      - name: Build API
        run: pnpm --filter @azela-pos/api build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
